<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Preview your LinkedIn banner on a company page or a personal profile, on desktop and mobile."
    />
    <title data-i18n="title">LinkedIn Banner Preview</title>
  </head>
  <body>
    <div class="bar">
      <label
        ><span data-i18n="language">Language</span>
        <select id="lang">
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </label>

      <label
        ><span data-i18n="view">View</span>
        <select id="mode">
          <option value="page-desktop" data-i18n="mode.page-desktop">Company page – desktop</option>
          <option value="page-mobile" data-i18n="mode.page-mobile">
            Company page – mobile (measured)
          </option>
          <option value="profil-desktop" data-i18n="mode.profil-desktop">Profile – desktop</option>
          <option value="profil-mobile" data-i18n="mode.profil-mobile">Profile – mobile</option>
        </select>
      </label>

      <label
        ><span data-i18n="banner">Your banner</span>
        <input type="file" id="bannerFile" accept="image/*" />
      </label>
      <label
        ><span data-i18n="avatar">Your avatar (optional)</span>
        <input type="file" id="avatarFile" accept="image/*" />
      </label>

      <label><span data-i18n="name">Name</span><input type="text" id="name" /></label>
      <label><span data-i18n="tagline">Tagline</span><input type="text" id="tagline" /></label>

      <label class="chk"
        ><input type="checkbox" id="zone" />
        <span data-i18n="zone">Show the area to avoid</span></label
      >
      <label class="chk"
        ><input type="checkbox" id="ghost" />
        <span data-i18n="ghost">Transparent avatar</span></label
      >

      <div class="group">
        <label
          ><span data-i18n="bh">Banner height</span>
          <input type="number" id="bh" min="40" step="any"
        /></label>
        <label
          ><span data-i18n="as">Avatar size</span> <input type="number" id="as" min="40" step="1"
        /></label>
        <label
          ><span data-i18n="al">Left offset</span> <input type="number" id="al" min="0" step="1"
        /></label>
        <label
          ><span data-i18n="ao">Banner overlap</span> <input type="number" id="ao" min="0" step="1"
        /></label>
        <label
          ><span data-i18n="am">Safety margin</span> <input type="number" id="am" min="0" step="1"
        /></label>
        <button id="reset" type="button" data-i18n="reset">Reset to defaults</button>
      </div>

      <div id="infos"></div>
    </div>

    <div id="scene">
      <div id="fit">
        <div id="frame">
          <div class="banner" id="bannerBox">
            <img id="bannerImg" alt="Banner" />
            <div class="zone" id="zoneBox"></div>
          </div>
          <div class="avatar" id="avatarBox"><div class="inner" id="avatarInner">Y</div></div>
          <div class="info" id="info">
            <h1 id="nameOut"></h1>
            <p class="tag" id="tagOut"></p>
            <div class="meta" data-i18n="meta"></div>
            <div class="btns">
              <span data-i18n="follow">+ Follow</span><span data-i18n="visit">Visit website</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="note" data-i18n-html="footer"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
