name: Bug report
description: Something does not work in the tool
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The URL (with its parameters) helps.
  - type: input
    id: browser
    attributes:
      label: Browser and version
